[project]
name = "nytcrossword2remarkable"
version = "1.0.0"
description = "Downloads the daily New York Times crossword PDF and uploads it to reMarkable Cloud"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
